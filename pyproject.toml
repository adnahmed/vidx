[project]
name = "vidx"
version = "0.1.0"
description = ""
authors = []
requires-python = ">3.10"
readme = "README.md"
maintainers = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.115.6,<0.116",
    "uvicorn[standard]>=0.34.0,<0.35",
    "gunicorn>=23.0.0,<24",
    "pydantic>=2.10.4,<3",
    "pydantic-settings>=2.7.0,<3",
    "yarl>=1.18.3,<2",
    "ujson>=5.10.0,<6",
    "httptools>=0.6.4,<0.7",
    "beanie>=1.28.0,<2",
    "python-multipart>=0.0.20,<0.0.21",
    "python-magic>=0.4.27,<0.5",
    "ffmpeg-python>=0.2.0,<0.3",
    "pydantic-async-validation>=0.3.0,<0.4",
    "celery>=5.5.2,<6",
    "httpx>=0.27.0,<0.28",
    "boto3>=1.34.0,<2",
    "aioboto3>=12.0.0,<13",
    "redis[hiredis]>=5.0.0,<6",
    "authlib>=1.3.2,<2",
    "google-auth>=2.35.0,<3",
    "passlib[bcrypt]>=1.7.4,<2",
    "python-jose[cryptography]>=3.3.0,<4",
    "email-validator>=2.2.0,<3",
    "requests>=2.32.5,<3",
    "youtube-transcript-api>=1.2.2,<2",
    "openpyxl>=3.1.5",
]

[project.scripts]
start-celery = "run_celery_worker:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.5.0,<0.6",
    "mypy>=1.10.1,<2",
    "pre-commit>=3.7.1,<4",
    "black>=24.4.2,<25",
    "pytest-cov>=5,<6",
    "anyio>=4,<5",
    "pytest-env>=1.1.3,<2",
    "mongomock-motor>=0.0.36",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[tool.isort]
profile = "black"
multi_line_output = 3
src_paths = ["vidx",]

[tool.mypy]
strict = true
ignore_missing_imports = true
allow_subclassing_any = true
allow_untyped_calls = true
pretty = true
show_error_codes = true
implicit_reexport = true
allow_untyped_decorators = true
warn_unused_ignores = false
warn_return_any = false
namespace_packages = true

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore:.*unclosed.*:ResourceWarning",
]
env = [
    "VIDX_ENVIRONMENT=pytest",
    "VIDX_DB_BASE=admin",
]

[tool.ruff]
# List of enabled rulsets.
# See https://docs.astral.sh/ruff/rules/ for more information.
lint.select = [
    "E",   # Error
    "F",   # Pyflakes
    "W",   # Pycodestyle
    "C90", # McCabe complexity
    "I",   # Isort
    "N",   # pep8-naming
    "D",   # Pydocstyle
    "ANN", # Pytype annotations
    "S",   # Bandit
    "B",   # Bugbear
    "COM", # Commas
    "C4",  # Comprehensions
    "ISC", # Implicit string concat
    "PIE", # Unnecessary code
    "T20", # Catch prints
    "PYI", # validate pyi files
    "Q",   # Checks for quotes
    "RSE", # Checks raise statements
    "RET", # Checks return statements
    "SLF", # Self checks
    "SIM", # Simplificator
    "PTH", # Pathlib checks
    "ERA", # Checks for commented out code
    "PL",  # PyLint checks
    "RUF", # Specific to Ruff checks
]
lint.ignore = [
    "D",       # Docstring rules
    "D101",    # Missing docstring in public module
    "D102",    # Missing docstring in public method
    "D105",    # Missing docstring in magic method
    "D205",    # Whitespace before : in multi-line docstring
    "D107",    # Missing docstring in __init__
    "B008",    # Do not perform function calls in argument defaults
    "D211",    # No blank lines allowed before class docstring
    "D212",    # Multi-line docstring summary should start at the first line
    "D401",    # First line should be in imperative mood
    "D104",    # Missing docstring in public package
    "D100",    # Missing docstring in public module
    "D202",    # No blank lines allowed after function docstring
    "E501",    # Line too long
    "PTH105",  # Pathlib checks
    "PTH120",  # Pathlib checks
    "PLR0915", # Too many statements in function
    "PLR0912", # Too many branches in function
    "C901",    # Too many lines in module
    "S603",    # `subprocess` call checks for execution of untrusted input
    "S108",    # Portable insecure usage of temporary file
    "ANN102",  # Missing type annotation for self in method
    "ANN101",  # Missing type annotation for argument
    "ANN401",  # typing.Any are disallowed in `**kwargs
    "PLR0913", # Too many arguments for function call
    "D106",    # Missing docstring in public nested class
]
lint.mccabe = { max-complexity = 10 }
exclude = [
    ".venv/"
]
line-length = 88

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", # Use of assert detected
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
ignore-decorators = ["typing.overload"]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str", "float", "bytes"]


[fastapi-template.options]
project_name = "vidx"
api_type = "rest"
enable_redis = "None"
enable_rmq = "True"
ci_type = "none"
enable_migrations = "None"
enable_taskiq = "None"
enable_kube = "None"
kube_name = "vidx"
enable_routers = "True"
enable_kafka = "None"
enable_loguru = "None"
traefik_labels = "None"
add_dummy = "True"
orm = "beanie"
self_hosted_swagger = "None"
prometheus_enabled = "None"
sentry_enabled = "None"
otlp_enabled = "None"
gunicorn = "True"
add_users = "None"
cookie_auth = "None"
jwt_auth = "None"

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"
