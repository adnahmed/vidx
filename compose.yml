# Use root/example as user/password credentials

services:

  mongo:
    image: mongo
    restart: always
    volumes:
      - db-data:/data/db
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: vidx
      MONGO_INITDB_ROOT_PASSWORD: vidx
      MONGO_INITDB_DATABASE: admin

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://vidx:vidx@mongo:27017/
      ME_CONFIG_BASICAUTH: false

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: vidx
      RABBITMQ_DEFAULT_PASS: vidx
    volumes:
      - config-rabbitmq:/var/lib/rabbitmq
      - db-rabbitmq:/data

volumes:
  db-data:
  db-rabbitmq:
  config-rabbitmq:
