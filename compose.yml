services:

  api: &main_app
    build:
      context: .
      dockerfile: ./Dockerfile
    image: vidx:${VIDX_VERSION:-latest}
    restart: always
    ports:
      - "8000:8000"
    entrypoint: [ "docker-entrypoint.sh" ]
    depends_on:
      db:
        condition: service_healthy
    environment:
      VIDX_HOST: 0.0.0.0
      VIDX_DB_HOST: vidx-db
      VIDX_DB_PORT: 27017
      VIDX_DB_USER: vidx
      VIDX_DB_PASS: vidx
      VIDX_DB_BASE: admin
      RABBITMQ_HOST: vidx-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: vidx
      RABBITMQ_PASS: vidx
      RABBITMQ_BASE: /
      FFMPEG_BINARY: /opt/ffmpeg_build/bin/ffmpeg
      FFPROBE_BINARY: /opt/ffmpeg_build/bin/ffprobe
    volumes:
      - tmp-store:/tmp
    healthcheck:
      test:
        - CMD-SHELL
        - >
          python -c "import sys,urllib.request;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').getcode()==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  db:
    image: mongo:latest
    hostname: vidx-db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: "vidx"
      MONGO_INITDB_ROOT_PASSWORD: "vidx"
    command: ["mongod", "--auth"]
    volumes:
      - db-data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$MONGO_INITDB_ROOT_USERNAME\" --password \"$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' admin | grep 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  rabbitmq:
    image: rabbitmq:3-management
    hostname: vidx-rabbitmq
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      RABBITMQ_DEFAULT_USER: vidx
      RABBITMQ_DEFAULT_PASS: vidx
    volumes:
      - config-rabbitmq:/var/lib/rabbitmq
      - db-rabbitmq:/data

  celery:
    <<: *main_app # inherit all the settings from the main app
    ports: [] # Override ports with empty array to prevent port binding
    entrypoint: [ "docker-entrypoint.sh" ]
    command: poetry run start-celery
    depends_on:
      - api
      - rabbitmq

volumes:
  db-data:
  db-rabbitmq:
  tmp-store:
  config-rabbitmq:
